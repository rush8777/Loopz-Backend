name: Backend live-editor validation
on:
  push:
    branches:
      - codex/live-editor-fast-start-navigation-20261118
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test -- --reporter=verbose
      - name: Build
        run: npm run build
