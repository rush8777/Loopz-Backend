name: Contact endpoint checks

on:
  pull_request:
    paths:
      - 'src/app.ts'
      - 'src/config.ts'
      - 'src/routes/public-contact.ts'
      - 'src/lib/contact.ts'
      - 'tests/public-contact.test.ts'
      - '.github/workflows/contact-checks.yml'

permissions:
  contents: read

jobs:
  contact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check backend
        run: npm run build
      - name: Test public contact route
        run: npx vitest run tests/public-contact.test.ts
